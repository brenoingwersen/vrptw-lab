[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "ortools>=9.15.6755",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
