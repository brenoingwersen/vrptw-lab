services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vrptw}
      POSTGRES_USER: ${POSTGRES_USER:-vrptw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vrptw}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_init/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  db-init:
    build:
      context: .
      dockerfile: db_init/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vrptw}:${POSTGRES_PASSWORD:-vrptw}@postgres:5432/${POSTGRES_DB:-vrptw}
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vrptw}:${POSTGRES_PASSWORD:-vrptw}@postgres:5432/${POSTGRES_DB:-vrptw}
    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://api:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://api:8000"
      REQUEST_TIMEOUT: 10
      DEBUG: "false"
    ports:
      - "3000:8050" # <browser (computer) port>:<container port>

volumes:
  pgdata:
