[project]
name = "vrptw-lab"
version = "0.1.0"
description = "A lab for solving VRPTW problems with CP-SAT."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "loguru>=0.7.3",
    "numpy>=2.0",
    "ortools>=9.15.6755",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/vrptw", "src/db"]

line-length = 88
indent-width = 4

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
